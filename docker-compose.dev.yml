services:
  mysql:
    image: mysql:8.0
    container_name: smartoffice-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: smartoffice
      MYSQL_USER: smartoffice
      MYSQL_PASSWORD: smartoffice123
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - smartoffice_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot123456"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.0-alpine
    container_name: smartoffice-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - smartoffice_redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  smartoffice_mysql_data:
  smartoffice_redis_data:
