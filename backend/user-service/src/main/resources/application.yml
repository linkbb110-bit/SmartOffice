server:
  port: ${SERVER_PORT:8082}
spring:
  application:
    name: smartoffice-user-service
  profiles:
    default: local
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/smartoffice_user?serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:smartoffice_user}
    password: ${DB_PASSWORD:}
  sql:
    init:
      mode: never
  cloud:
    nacos:
      discovery:
        enabled: false
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-value: 1
      logic-not-delete-value: 0
smartoffice:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:PT2H}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:5175,http://localhost:18080,http://127.0.0.1:18080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
